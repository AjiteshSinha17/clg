<style>
        .splash-container {
            background-color: #1F150C; /* Deep Espresso */
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .brand-text {
            color: #E1DCC9; /* Soft Cream */
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 0.5s;
            text-shadow: 0 4px 20px rgba(225, 220, 201, 0.2);
        }

        .tagline {
            color: #E1DCC9;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 1s;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ambient-glow {
            position: absolute;
            width: 60vh;
            height: 60vh;
            background: radial-gradient(circle, rgba(65, 45, 21, 0.4) 0%, rgba(31, 21, 12, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            from { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            to { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lottie-container {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            animation-delay: 0.2s;
            filter: drop-shadow(0 0 10px rgba(225, 220, 201, 0.1));
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased overflow-hidden">
<div class="splash-container">
<!-- Subtle background texture/glow -->
<div class="ambient-glow"></div>
<div class="content-wrapper">
<!-- Simulated Lottie Animation area -->
<div class="lottie-container flex items-center justify-center rounded-full bg-rich-brown/20 border border-soft-cream/10 backdrop-blur-md">
<span class="material-symbols-outlined text-6xl text-primary-container" style="font-variation-settings: 'FILL' 1;">
                    hub
                 </span>
</div>
<!-- Brand Name -->
<h1 class="brand-text font-display-lg text-display-lg tracking-tight mb-4">
                ClgJone
            </h1>
<!-- Tagline -->
<p class="tagline font-body-lg text-body-lg text-on-surface-variant/80 tracking-wide">
                Connect. Discover. Belong.
            </p>
</div>
<!-- Loading indicator line -->
<div class="absolute bottom-16 left-1/2 -translate-x-1/2 w-48 h-1 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-1/3 animate-[slide_2s_ease-in-out_infinite]"></div>
</div>
<style>
            @keyframes slide {
                0% { transform: translateX(-100%); }
                50% { transform: translateX(200%); }
                100% { transform: translateX(-100%); }
            }
        </style>
</div>
<script>
        // Simulated transition after splash
        setTimeout(() => {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.8s ease-out';
        }, 4000);
    </script>
</body></html>
